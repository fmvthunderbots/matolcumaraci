<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WRO Mat Ölçüm Aracı</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
            align-items: center;
            flex-wrap: wrap;
        }
        select {
            padding: 10px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #ccc;
            cursor: pointer;
            flex-grow: 1;
        }
        #offlineBtn {
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            background-color: #3498db;
            color: white;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        #offlineBtn:hover {
            background-color: #2980b9;
        }
        #offlineBtn:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        .measurement-info {
            background-color: #eafaf1;
            color: #27ae60;
            padding: 15px;
            border-radius: 4px;
            border-left: 5px solid #2ecc71;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-grow: 2;
            width: 100%;
        }
        .measurement-info h3 {
            margin: 0;
            font-size: 1.2em;
        }
        #resultText {
            font-size: 1.5em;
            font-weight: bold;
        }
        #canvas-wrapper {
            position: relative;
            display: block;
            width: 100%;
            border: 2px solid #ccc;
            background-color: #f0f0f0;
            border-radius: 4px;
            overflow: hidden;
        }
        #matImage {
            display: block;
            width: 100%;
            height: auto;
            pointer-events: none;
        }
        #measureCanvas {
            position: absolute;
            top: 0;
            left: 0;
            cursor: crosshair;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="controls">
            <select id="matSelector" onchange="changeMat()">
                <option value="mat1">Küçük Yıldızlar Matı</option>
                <option value="mat2">Yıldızlar Matı</option>
            </select>
            
            <button id="offlineBtn" onclick="saveToOffline()">Görselleri Tablete Kaydet</button>

            <div class="measurement-info">
                <div>
                    <h3>Mesafe (Gerçek Boyut: 236.2 cm x 114.3 cm)</h3>
                </div>
                <div id="resultText">0.0 cm</div>
            </div>
        </div>

        <div id="canvas-wrapper">
            <img id="matImage" alt="WRO Mat" crossorigin="anonymous">
            <canvas id="measureCanvas"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('measureCanvas');
        const ctx = canvas.getContext('2d');
        const img = document.getElementById('matImage');
        const resultText = document.getElementById('resultText');

        let isDrawing = false;
        let startX = 0;
        let startY = 0;

        const matUrls = {
            'mat1': 'https://i.imgur.com/809nJsq.jpeg',
            'mat2': 'https://i.imgur.com/tAMgUHC.jpeg'
        };

        function changeMat() {
            const selector = document.getElementById('matSelector');
            const selectedVal = selector.value;
            
            const savedImage = localStorage.getItem(selectedVal);
            if (savedImage) {
                img.src = savedImage;
            } else {
                img.src = matUrls[selectedVal];
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            resultText.innerText = "0.0 cm";
        }

        function saveToOffline() {
            const offlineBtn = document.getElementById('offlineBtn');
            offlineBtn.innerText = "Kaydediliyor...";
            offlineBtn.disabled = true;

            const matsToSave = ['mat1', 'mat2'];
            let savedCount = 0;
            let errorCount = 0;

            matsToSave.forEach(matId => {
                const tempImg = new Image();
                tempImg.crossOrigin = "Anonymous";
                
                tempImg.onload = function() {
                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = tempImg.width;
                    tempCanvas.height = tempImg.height;
                    const tCtx = tempCanvas.getContext('2d');
                    tCtx.drawImage(tempImg, 0, 0);
                    
                    try {
                        const dataURL = tempCanvas.toDataURL('image/jpeg', 0.8);
                        localStorage.setItem(matId, dataURL);
                        savedCount++;
                    } catch (e) {
                        console.error("Kayıt hatası:", e);
                        errorCount++;
                    }
                    checkDone();
                };

                tempImg.onerror = function() {
                    errorCount++;
                    checkDone();
                };

                tempImg.src = matUrls[matId];
            });

            function checkDone() {
                if (savedCount + errorCount === matsToSave.length) {
                    if (errorCount === 0) {
                        alert("Görseller tablete kaydedildi. Artık internet olmadan kullanabilirsiniz.");
                        offlineBtn.innerText = "Kaydedildi";
                    } else {
                        alert("Tarayıcı güvenliği (CORS) veya boyut sınırları nedeniyle kayıt başarısız oldu.");
                        offlineBtn.innerText = "Tekrar Dene";
                        offlineBtn.disabled = false;
                    }
                }
            }
        }

        function resizeCanvas() {
            canvas.width = img.clientWidth;
            canvas.height = img.clientHeight;
        }

        img.addEventListener('load', resizeCanvas);
        window.addEventListener('resize', resizeCanvas);

        canvas.addEventListener('mousedown', function(e) {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            startX = e.clientX - rect.left;
            startY = e.clientY - rect.top;
        });

        canvas.addEventListener('mousemove', function(e) {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const currentX = e.clientX - rect.left;
            const currentY = e.clientY - rect.top;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(currentX, currentY);
            ctx.strokeStyle = '#e74c3c';
            ctx.lineWidth = 3;
            ctx.stroke();

            calculateDistance(currentX, currentY);
        });

        canvas.addEventListener('mouseup', function(e) {
            if (!isDrawing) return;
            isDrawing = false;
            const rect = canvas.getBoundingClientRect();
            const endX = e.clientX - rect.left;
            const endY = e.clientY - rect.top;

            calculateDistance(endX, endY);
        });

        canvas.addEventListener('mouseleave', function() {
            isDrawing = false;
        });

        canvas.addEventListener('touchstart', function(e) {
            if(e.touches.length > 0) {
                isDrawing = true;
                const rect = canvas.getBoundingClientRect();
                startX = e.touches[0].clientX - rect.left;
                startY = e.touches[0].clientY - rect.top;
                e.preventDefault();
            }
        }, {passive: false});

        canvas.addEventListener('touchmove', function(e) {
            if (!isDrawing || e.touches.length === 0) return;
            const rect = canvas.getBoundingClientRect();
            const currentX = e.touches[0].clientX - rect.left;
            const currentY = e.touches[0].clientY - rect.top;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(currentX, currentY);
            ctx.strokeStyle = '#e74c3c';
            ctx.lineWidth = 3;
            ctx.stroke();

            calculateDistance(currentX, currentY);
            e.preventDefault();
        }, {passive: false});

        canvas.addEventListener('touchend', function(e) {
            isDrawing = false;
        });

        function calculateDistance(x, y) {
            const dx = x - startX;
            const dy = y - startY;
            const distanceInPixels = Math.sqrt(dx * dx + dy * dy);
            
            const cmPerPixel = 236.2 / canvas.width; 
            const realDistanceCm = distanceInPixels * cmPerPixel;

            resultText.innerText = realDistanceCm.toFixed(1) + " cm";
        }

        // Sayfa yüklendiğinde varsayılan matı aç
        window.onload = function() {
            changeMat();
        };
    </script>
</body>
</html>
