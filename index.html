<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WRO Mat Ölçüm Aracı</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
            align-items: center;
        }
        select {
            padding: 10px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #ccc;
            cursor: pointer;
            flex-grow: 1;
        }
        .measurement-info {
            background-color: #eafaf1;
            color: #27ae60;
            padding: 15px;
            border-radius: 4px;
            border-left: 5px solid #2ecc71;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-grow: 2;
        }
        .measurement-info h3 {
            margin: 0;
            font-size: 1.2em;
        }
        #resultText {
            font-size: 1.5em;
            font-weight: bold;
        }
        #canvas-wrapper {
            position: relative;
            display: block;
            width: 100%;
            border: 2px solid #ccc;
            background-color: #f0f0f0;
            border-radius: 4px;
            overflow: hidden;
        }
        #matImage {
            display: block;
            width: 100%;
            height: auto;
            pointer-events: none;
        }
        #measureCanvas {
            position: absolute;
            top: 0;
            left: 0;
            cursor: crosshair;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="controls">
            <select id="matSelector" onchange="changeMat()">
                <option value="https://i.imgur.com/809nJsq.jpeg">Küçük Yıldızlar Matı</option>
                <option value="https://i.imgur.com/tAMgUHC.jpeg">Yıldızlar Matı</option>
            </select>

            <div class="measurement-info">
                <div>
                    <h3>Mesafe (Gerçek Boyut: 236.2 cm x 114.3 cm)</h3>
                </div>
                <div id="resultText">0.0 cm</div>
            </div>
        </div>

        <div id="canvas-wrapper">
            <img id="matImage" src="https://i.imgur.com/809nJsq.jpeg" alt="WRO Mat">
            <canvas id="measureCanvas"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('measureCanvas');
        const ctx = canvas.getContext('2d');
        const img = document.getElementById('matImage');
        const resultText = document.getElementById('resultText');

        let isDrawing = false;
        let startX = 0;
        let startY = 0;

        function changeMat() {
            const selector = document.getElementById('matSelector');
            img.src = selector.value;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            resultText.innerText = "0.0 cm";
        }

        function resizeCanvas() {
            canvas.width = img.clientWidth;
            canvas.height = img.clientHeight;
        }

        img.addEventListener('load', resizeCanvas);
        window.addEventListener('resize', resizeCanvas);

        if(img.complete) {
            resizeCanvas();
        }

        canvas.addEventListener('mousedown', function(e) {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            startX = e.clientX - rect.left;
            startY = e.clientY - rect.top;
        });

        canvas.addEventListener('mousemove', function(e) {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const currentX = e.clientX - rect.left;
            const currentY = e.clientY - rect.top;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(currentX, currentY);
            ctx.strokeStyle = '#e74c3c';
            ctx.lineWidth = 3;
            ctx.stroke();

            calculateDistance(currentX, currentY);
        });

        canvas.addEventListener('mouseup', function(e) {
            if (!isDrawing) return;
            isDrawing = false;
            const rect = canvas.getBoundingClientRect();
            const endX = e.clientX - rect.left;
            const endY = e.clientY - rect.top;

            calculateDistance(endX, endY);
        });

        canvas.addEventListener('mouseleave', function() {
            isDrawing = false;
        });

        // Dokunmatik ekran desteği (Tablet/Telefon için)
        canvas.addEventListener('touchstart', function(e) {
            if(e.touches.length > 0) {
                isDrawing = true;
                const rect = canvas.getBoundingClientRect();
                startX = e.touches[0].clientX - rect.left;
                startY = e.touches[0].clientY - rect.top;
                e.preventDefault();
            }
        }, {passive: false});

        canvas.addEventListener('touchmove', function(e) {
            if (!isDrawing || e.touches.length === 0) return;
            const rect = canvas.getBoundingClientRect();
            const currentX = e.touches[0].clientX - rect.left;
            const currentY = e.touches[0].clientY - rect.top;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(currentX, currentY);
            ctx.strokeStyle = '#e74c3c';
            ctx.lineWidth = 3;
            ctx.stroke();

            calculateDistance(currentX, currentY);
            e.preventDefault();
        }, {passive: false});

        canvas.addEventListener('touchend', function(e) {
            isDrawing = false;
        });

        function calculateDistance(x, y) {
            const dx = x - startX;
            const dy = y - startY;
            const distanceInPixels = Math.sqrt(dx * dx + dy * dy);
            
            // Masanın gerçek uzunluğu 236.2 cm
            const cmPerPixel = 236.2 / canvas.width; 
            const realDistanceCm = distanceInPixels * cmPerPixel;

            resultText.innerText = realDistanceCm.toFixed(1) + " cm";
        }
    </script>
</body>
</html>
